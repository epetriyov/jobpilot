name: Deploy

# Деплой по тегу vX.Y.Z: VPS НЕ собирает образ (1 GB без swap → OOM), а тянет
# готовый из GHCR (собран workflow Image, docs/INFRA.md §5.2). SSH-скрипт логинится
# в GHCR коротким GITHUB_TOKEN этого джоба (пакет приватный — публичным делать не надо).
# Секреты: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_APP_DIR (опц.).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_ACTOR,GHCR_TOKEN,REPO,TAG
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.VPS_APP_DIR }}"; APP_DIR="${APP_DIR:-/opt/jobpilot}"
            cd "$APP_DIR"

            # compose-файлы и исходник миграций — с тега
            git fetch --all --tags
            git checkout "$TAG"

            # образ из GHCR (репозиторий → нижний регистр, требование ghcr)
            REPO_LC="$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
            export JOBPILOT_IMAGE="ghcr.io/${REPO_LC}:${TAG}"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            # Image-workflow пушит тот же тег параллельно — ждём появления образа
            for i in $(seq 1 10); do
              if docker compose pull bot worker; then break; fi
              echo "образ ещё не опубликован, попытка $i/10 — ждём 30с"; sleep 30
            done

            docker compose up -d --no-build
            docker compose run --rm --no-deps worker alembic upgrade head
            docker logout ghcr.io || true
            docker compose ps
