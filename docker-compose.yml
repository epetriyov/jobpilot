# JobPilot — этап 0: bot, worker, db, alloy.
# Postgres/Alloy наружу НЕ публикуются (constitution IV; UFW — только 22 на VPS).
# Профили langfuse/mcp добавляются на этапах 1/6.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot}
      POSTGRES_DB: ${POSTGRES_DB:-jobpilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobpilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # порт наружу не публикуется — доступ только внутри compose-сети

  alloy:
    image: grafana/alloy:latest
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT:-}
      GRAFANA_CLOUD_INSTANCE_ID: ${GRAFANA_CLOUD_INSTANCE_ID:-}
      GRAFANA_CLOUD_API_TOKEN: ${GRAFANA_CLOUD_API_TOKEN:-}
    restart: unless-stopped
    # OTLP-приём 4317/4318 доступен сервисам внутри сети; наружу не публикуется

  bot:
    build: .
    command: python -m app.bot
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql+psycopg://${POSTGRES_USER:-jobpilot}:${POSTGRES_PASSWORD:-jobpilot}@db:5432/${POSTGRES_DB:-jobpilot}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
    depends_on:
      db:
        condition: service_healthy
      alloy:
        condition: service_started
    restart: unless-stopped

  worker:
    build: .
    command: python -m app.worker
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql+psycopg://${POSTGRES_USER:-jobpilot}:${POSTGRES_PASSWORD:-jobpilot}@db:5432/${POSTGRES_DB:-jobpilot}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
    depends_on:
      db:
        condition: service_healthy
      alloy:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
